[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partllm-vllm-bridge"
version = "0.1.0"
description = "Isolated vLLM bridge for the PartLLM Qwen3-VL language-model path"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."vllm.general_plugins"]
partllm_vllm_bridge = "partllm_vllm.plugin:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

